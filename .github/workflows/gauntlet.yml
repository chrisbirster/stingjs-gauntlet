name: StingJS RC Gauntlet

on:
  workflow_dispatch:
    inputs:
      sting_selector:
        description: Exact StingJS prerelease version or npm dist-tag
        required: true
        default: next
        type: string

permissions:
  contents: read

env:
  npm_config_yes: 'true'

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use StingJS npm version
        run: npm install --global npm@12.0.2
      - name: Resolve selector to one exact release cohort
        id: resolve
        shell: bash
        env:
          STING_SELECTOR: ${{ inputs.sting_selector }}
        run: |
          set -euo pipefail
          version="$(npm view "create-sting@${STING_SELECTOR}" version | tail -n 1 | tr -d '[:space:]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved ${STING_SELECTOR} -> ${version}"

  smoke:
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@12.0.2
      - name: Create from the public registry
        run: npm create "sting@${{ needs.resolve.outputs.version }}" gauntlet-app -- --name stingjs-gauntlet-app
      - name: Install and run public CLI gates
        working-directory: gauntlet-app
        run: |
          npm install
          npx --no-install sting doctor
          npx --no-install sting test
          npx --no-install sting ci
      - name: Prove dependency integrity
        run: node scripts/check-integrity.mjs gauntlet-app "${{ needs.resolve.outputs.version }}"
      - name: Record evidence
        run: node scripts/write-evidence.mjs evidence/smoke.json smoke "${{ needs.resolve.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-smoke-${{ needs.resolve.outputs.version }}
          path: evidence/smoke.json
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm install --global npm@12.0.2
      - name: Create and install from the public registry
        run: |
          npm create "sting@${{ needs.resolve.outputs.version }}" gauntlet-app -- --name stingjs-gauntlet-app
          cd gauntlet-app
          npm install
          npm run build
      - name: Prove dependency integrity
        run: node scripts/check-integrity.mjs gauntlet-app "${{ needs.resolve.outputs.version }}"
      - name: Build generated Android app without Sting source or Zig setup
        working-directory: gauntlet-app/android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Record evidence
        run: node scripts/write-evidence.mjs evidence/android.json android "${{ needs.resolve.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-android-${{ needs.resolve.outputs.version }}
          path: |
            evidence/android.json
            gauntlet-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    needs: resolve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@12.0.2
      - name: Create and install from the public registry
        run: |
          npm create "sting@${{ needs.resolve.outputs.version }}" gauntlet-app -- --name stingjs-gauntlet-app
          cd gauntlet-app
          npm install
          npm run build
      - name: Prove dependency integrity
        run: node scripts/check-integrity.mjs gauntlet-app "${{ needs.resolve.outputs.version }}"
      - name: Build generated iOS Simulator app without Sting source or Zig setup
        run: |
          xcodebuild \
            -project gauntlet-app/ios/StingApp.xcodeproj \
            -scheme StingApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Record evidence
        run: node scripts/write-evidence.mjs evidence/ios.json ios-simulator "${{ needs.resolve.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-ios-${{ needs.resolve.outputs.version }}
          path: evidence/ios.json
          if-no-files-found: error
